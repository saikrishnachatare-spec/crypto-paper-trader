name: Laya paper trader

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview candles and Laya signals without fills or state changes"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# One workflow run at a time, regardless of event or branch, to protect portfolio state.
concurrency:
  group: crypto-paper-trader-state
  cancel-in-progress: false

jobs:
  paper-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-laya.txt

      - name: Cache Laya model files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: laya-model-${{ runner.os }}-py312-${{ hashFiles('requirements-laya.txt') }}
          restore-keys: |
            laya-model-${{ runner.os }}-py312-

      - name: Install Laya CPU runtime
        run: python -m pip install -r requirements-laya.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run one cycle
        env:
          LAYA_CLI: laya
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" == "true" ]]; then
            python -m paper_trader --dry-run
          else
            python -m paper_trader
          fi

      - name: Commit updated paper portfolio
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        run: |
          if git diff --quiet -- data/portfolio.json; then
            echo "No portfolio changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio.json
          git commit -m "chore: update simulated portfolio state"
          git push
